[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-world"
version = "0.1.0"
description = "Urban agent-based simulation with LLM policies"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mini_world*"]

[tool.setuptools.package-data]
mini_world = ["prompts/*.yaml"]
