step_scheduler:
  ckpt_every_steps: 500
  val_every_steps: 500  # will run every x number of gradient steps
  num_epochs: 10
  global_batch_size: 8
  local_batch_size: 1  # AutoModel per-rank micro batch

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: unsloth/gpt-oss-20b-BF16
  trust_remote_code: true




peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  # match_all_linear: True
  target_modules:
    - "*.self_attn.q_proj"
    - "*.self_attn.k_proj"
    - "*.self_attn.v_proj"
    - "*.self_attn.o_proj"
    - "*.mlp.experts.gate_up_projs.*"
    - "*.mlp.experts.down_projs.*"
  dim: 8
  alpha: 16
  # use_triton: True
  # dtype needs a fix to resolve to type instead of string
  # lora_dtype: torch.bfloat16

checkpoint:
  enabled: true
  checkpoint_dir: UrbanLLMind_mobility_reasoning_gpt_oss_20b/
  model_save_format: safetensors # torch_save or safetensors
  save_consolidated: true # saves the model in a consolidated safetensors format. Requires model_save_format to be safetensors.

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 1

  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.te_parallel_ce.TEParallelCrossEntropy


dataset:
  _target_: nemo_automodel.components.datasets.llm.ChatDataset
  path_or_dataset_id: prb977/UrbanLLMind-mobility-reasoning-dataset
  split: train[:99%]
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: openai/gpt-oss-20b
  seq_length: 4096
  padding: do_not_pad
  truncation: true
  start_of_turn_token: "<|start|>"

packed_sequence:
  # Set packed_sequence_size > 0 to run with packed sequences. Note: currently unsupported with FlexAttention
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true


validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.ChatDataset
  path_or_dataset_id: prb977/UrbanLLMind-mobility-reasoning-dataset
  split: train[99%:]
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: openai/gpt-oss-20b
  seq_length: 4096
  padding: do_not_pad
  truncation: true
  start_of_turn_token: "<|start|>"

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  batch_size: 1

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-5
  lr: 1.0e-4
  weight_decay: 0.0
  fused: True
  # min_lr: 1.0e-5
